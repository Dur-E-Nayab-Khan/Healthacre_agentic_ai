<script>
// Detect if running on Vercel or locally, and route API calls to the live backend URL
const BACKEND_CLOUD_URL = "https://healthacre-agentic-ai-production.up.railway.app"; // <-- Replace with your actual deployed backend platform URL

const API = (window.location.hostname.includes("vercel.app"))
  ? BACKEND_CLOUD_URL
  : (window.location.origin.includes('localhost') || window.location.protocol === 'file:')
    ? "http://localhost:8000"
    : window.location.origin;

let token = null, role = null, sessionId = "sess-" + Math.random().toString(36).slice(2);

async function login(){
  const u = document.getElementById('username').value;
  const p = document.getElementById('password').value;
  const body = new URLSearchParams({ username: u, password: p });
  
  try {
    const res = await fetch(`${API}/auth/login`, { method:'POST', body });
    if(!res.ok){
      document.getElementById('login-err').textContent = "Login failed. Check username/password or backend status.";
      return;
    }
    const data = await res.json();
    token = data.access_token; role = data.role;
    document.getElementById('login-view').style.display = 'none';
    document.getElementById('app-view').style.display = 'grid';
    document.getElementById('role-badge').textContent = role;
    document.getElementById('staff-picker-field').style.display = (role === 'patient') ? 'none' : 'block';
    loadPatient();
  } catch (err) {
    document.getElementById('login-err').textContent = `Connection error to ${API}`;
  }
}

function logout(){
  token = null; role = null;
  document.getElementById('app-view').style.display = 'none';
  document.getElementById('login-view').style.display = 'block';
  document.getElementById('messages').innerHTML = '';
}

function currentPatientId(){
  if(role === 'patient') return null; // server resolves from token
  return document.getElementById('patient-id-input').value;
}

async function loadPatient(){
  const pid = role === 'patient' ? 'me' : currentPatientId();
  const url = role === 'patient' ? null : `${API}/patients/${pid}`;
  if(role === 'patient'){
    for(let i=1;i<=5;i++){
      const r = await fetch(`${API}/patients/${i}`, { headers:{Authorization:`Bearer ${token}`} });
      if(r.ok){ renderPatient(await r.json()); return; }
    }
    return;
  }
  const res = await fetch(url, { headers:{Authorization:`Bearer ${token}`} });
  if(!res.ok){ alert('Could not load patient ' + pid); return; }
  renderPatient(await res.json());
}

function renderPatient(p){
  document.getElementById('patient-name').textContent = p.full_name;
  document.getElementById('patient-mrn').textContent = p.mrn;
  document.getElementById('patient-dx').textContent = p.primary_diagnosis || '—';
  document.getElementById('patient-meds').textContent = p.medications || '—';
  window.__loadedPatientId = p.id;
}

async function sendMessage(){
  const input = document.getElementById('chat-input');
  const message = input.value.trim();
  if(!message) return;
  input.value = '';
  appendMessage('user', message);

  const payload = { session_id: sessionId, message };
  if(role !== 'patient') payload.patient_id = parseInt(currentPatientId());

  const res = await fetch(`${API}/chat`, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', Authorization:`Bearer ${token}` },
    body: JSON.stringify(payload)
  });
  if(!res.ok){
    appendMessage('assistant', `[error ${res.status}] ${await res.text()}`);
    return;
  }
  const data = await res.json();
  appendMessage('assistant', data.answer, data.trace);
}

function appendMessage(who, text, trace){
  const wrap = document.createElement('div');
  wrap.className = `msg ${who}`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  wrap.appendChild(bubble);
  if(trace && trace.length){
    const t = document.createElement('div');
    t.className = 'trace';
    t.innerHTML = trace.map(step =>
      `<div class="line"><span class="tool-name">${step.tool}</span>(${JSON.stringify(step.input)}) → ${String(step.output).slice(0,180)}</div>`
    ).join('');
    wrap.appendChild(t);
  }
  document.getElementById('messages').appendChild(wrap);
  wrap.scrollIntoView({ behavior:'smooth' });
}

// ---------- Document Q&A (RAG) tab ----------

function switchTab(name){
  document.getElementById('tab-chat').classList.toggle('active', name === 'chat');
  document.getElementById('tab-rag').classList.toggle('active', name === 'rag');
  document.getElementById('panel-chat').classList.toggle('active', name === 'chat');
  document.getElementById('panel-rag').classList.toggle('active', name === 'rag');
  document.getElementById('panel-chat').style.display = name === 'chat' ? 'flex' : 'none';
  document.getElementById('panel-rag').style.display = name === 'rag' ? 'block' : 'none';
  if(name === 'rag') loadRagFiles();
}

async function loadRagFiles(){
  const el = document.getElementById('rag-file-list');
  el.innerHTML = '<span class="empty">Loading…</span>';
  const res = await fetch(`${API}/rag/files`, { headers:{ Authorization:`Bearer ${token}` } });
  if(!res.ok){ el.innerHTML = `<span class="empty">Could not load file list (${res.status})</span>`; return; }
  const data = await res.json();
  el.innerHTML = data.files && data.files.length
    ? data.files.map(f => `📄 ${f}`).join('<br>')
    : '<span class="empty">No files indexed yet.</span>';
}

async function uploadRagFile(){
  const input = document.getElementById('rag-file-input');
  if(!input.files.length){ alert('Choose a .txt, .md, or .pdf file first.'); return; }
  const fd = new FormData();
  fd.append('file', input.files[0]);
  const res = await fetch(`${API}/rag/upload`, {
    method:'POST',
    headers:{ Authorization:`Bearer ${token}` },
    body: fd
  });
  if(!res.ok){ alert(`Upload failed (${res.status}): ${await res.text()}`); return; }
  input.value = '';
  await loadRagFiles();
}

async function reindexRag(){
  const res = await fetch(`${API}/rag/reindex`, { method:'POST', headers:{ Authorization:`Bearer ${token}` } });
  if(!res.ok){ alert(`Reindex failed (${res.status})`); return; }
  await loadRagFiles();
}

async function askRag(){
  const input = document.getElementById('rag-question-input');
  const question = input.value.trim();
  if(!question) return;
  input.value = '';
  const wrap = document.getElementById('rag-answer-wrap');
  wrap.innerHTML = '<div class="rag-answer">Thinking… (first question after startup can take longer — it builds the index)</div>';

  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 45000);

  try {
    const res = await fetch(`${API}/rag/query`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', Authorization:`Bearer ${token}` },
      body: JSON.stringify({ question, k: 4 }),
      signal: controller.signal
    });
    clearTimeout(timeoutId);

    if(!res.ok){
      wrap.innerHTML = `<div class="rag-answer">[error ${res.status}] ${await res.text()}</div>`;
      return;
    }
    const data = await res.json();
    let html = `<div class="rag-answer">${escapeHtml(data.answer)}</div>`;
    if(data.sources && data.sources.length){
      html += `<div class="rag-sources"><div class="k">Retrieved sources</div>` +
        data.sources.map(s => `
          <div class="source-card">
            <span class="fname">${s.source}</span><span class="rel">score ${s.relevance}</span>
            <div class="excerpt">${escapeHtml(s.excerpt)}…</div>
          </div>
        `).join('') + `</div>`;
    }
    wrap.innerHTML = html;
  } catch (err) {
    clearTimeout(timeoutId);
    if(err.name === 'AbortError'){
      wrap.innerHTML = `<div class="rag-answer">Request timed out after 45s. Check backend server logs for GEMINI_API_KEY errors.</div>`;
    } else {
      wrap.innerHTML = `<div class="rag-answer">Request failed: ${err.message}. Is the backend running at ${API}?</div>`;
    }
  }
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
